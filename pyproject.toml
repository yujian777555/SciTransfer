[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitransfer"
version = "0.1.0"
description = "Cross-domain scientific strategy transfer: paired intervention experiments on ScienceAgentBench"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
scitransfer = "scitransfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
